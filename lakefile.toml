name = "gradient-key-lean"
defaultTargets = ["GradientKey", "Section4", "Section3"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "GradientKey"

[[lean_lib]]
name = "Section4"
srcDir = "Section4"
roots = ["GradientKeySection4", "Lemma41", "Truncation", "Hoeffding", "DeletedPath", "Lemma43", "Theorem44", "P1_GreedyPath", "P2_SizeRecurrence", "P3_FiniteFibreCore", "P3_ConditionalFibre", "P5_InsertedRowTail", "P7_TailAggregation", "P8_Theorem44"]

[[lean_lib]]
name = "Section3"
srcDir = "Section3"
roots = ["TreeDepth", "Dense", "Missing", "NearBall", "Counting", "NearDense"]
